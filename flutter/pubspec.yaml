name: masker_app
description: "Cross-platform Flutter application for Dennis Masker wearable health sensor."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  cupertino_icons: ^1.0.6
  fl_chart: ^1.2.0
  flutter_bloc: ^9.1.1
  rxdart: ^0.28.0
  flutter_blue_plus: ^1.35.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
