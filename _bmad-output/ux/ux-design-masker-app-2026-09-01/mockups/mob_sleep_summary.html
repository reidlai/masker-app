<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Morning Sleep Summary — Sleep Apnea App</title>
  <style>
    :root {
      --bg-primary: #0F172A;
      --surface: #1E293B;
      --border: #334155;
      --accent-green: #10B981;
      --purple: #6D28D9;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
    body {
      background-color: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-primary);
    }
    .phone-frame {
      width: 390px;
      height: 844px;
      background-color: var(--bg-primary);
      border-radius: 48px;
      border: 12px solid #1E293B;
      box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 24px;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }
    .page-title { font-size: 20px; font-weight: 700; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; }
    
    .score-card {
      background: linear-gradient(135deg, #1E1B4B 0%, #311042 100%);
      border: 1px solid #4C1D95;
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .score-ring {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 6px solid var(--accent-green);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .score-num { font-size: 24px; font-weight: 800; }
    .score-label { font-size: 9px; text-transform: uppercase; color: var(--text-secondary); }
    .score-info h3 { font-size: 16px; margin-bottom: 4px; }
    .score-info p { font-size: 13px; color: var(--text-secondary); }
    
    .badge-normal {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(16,185,129,0.2);
      color: var(--accent-green);
      border: 1px solid var(--accent-green);
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 700;
      margin-top: 6px;
    }
    
    .chart-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .chart-title { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .waveform-svg { width: 100%; height: 120px; }
    
    .metrics-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .metric-item {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
    }
    .metric-item label { font-size: 12px; color: var(--text-secondary); display: block; margin-bottom: 4px; }
    .metric-item val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    
    .btn-export {
      width: 100%;
      height: 52px;
      background: var(--purple);
      color: white;
      border: none;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="status-bar">
      <span>07:00 AM</span>
      <span>D-BAND Unpaired ✓</span>
    </div>

    <div class="page-title">
      Morning Sleep Summary
      <span style="font-size: 12px; font-weight: 400; color: var(--text-secondary);">Sep 1, 2026</span>
    </div>

    <div class="score-card">
      <div class="score-ring">
        <span class="score-num">92</span>
        <span class="score-label">Score</span>
      </div>
      <div class="score-info">
        <h3>AHI 3.2 (Normal)</h3>
        <p>7 Hours 45 Mins Monitoring</p>
        <span class="badge-normal">NORMAL RESPIRATION</span>
      </div>
    </div>

    <div class="chart-card">
      <div class="chart-title">
        <span>Respiration Waveform (Skia 60 FPS)</span>
        <span style="color: var(--accent-green); font-size: 11px;">10Hz Stream</span>
      </div>
      <svg class="waveform-svg" viewBox="0 0 300 100">
        <path d="M 0 50 Q 15 20 30 50 T 60 50 T 90 50 T 120 50 T 150 90 T 180 50 T 210 20 T 240 50 T 270 50 T 300 50" stroke="#10B981" stroke-width="2.5" fill="none"/>
        <line x1="0" y1="50" x2="300" y2="50" stroke="#334155" stroke-dasharray="4 4"/>
        <circle cx="150" cy="90" r="5" fill="#EF4444"/>
        <text x="150" y="70" fill="#EF4444" font-size="9" text-anchor="middle">Apnea Stop (12s)</text>
      </svg>
    </div>

    <div class="metrics-grid">
      <div class="metric-item">
        <label>Total Apnea Stops</label>
        <val>2 Events</val>
      </div>
      <div class="metric-item">
        <label>Safety Taps</label>
        <val>1 Tap ("I'm Safe")</val>
      </div>
    </div>

    <button class="btn-export" onclick="alert('Exporting Signed FHIR JSON / PDF Clinical Report for Physician...')">
      📄 Export Signed Report for Physician
    </button>
  </div>
</body>
</html>
