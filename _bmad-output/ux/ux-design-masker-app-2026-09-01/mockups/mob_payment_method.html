<!-- SHARED TEMPLATE — iPhone 17 Pro Max standard artboard (440x956 pt logical resolution).
     Do not alter the chrome markup/CSS below (.device-frame, .status-bar, .dynamic-island, .home-indicator).
     Every mockup embeds this verbatim so the set reads as one consistent iPhone. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Method — Sleep Apnea Detection App</title>
<style>
  /*
    MOB_PAYMENT_METHOD illustrates (see EXPERIENCE.md "Payment Method (MOB_PAYMENT_METHOD)",
    Component Pattern #12 PaymentMethodCardOrganism, State Patterns #19
    State_PaymentMethodOnFile, DESIGN.md Components #6b PaymentMethodCard, Interaction
    Primitives "Hosted Payment Sheet Hand-off"):
    - Pushed detail screen from Settings > Subscription (and cross-linked from MOB_BILLING).
      App bar: ‹ back + "Payment Method".
    - MANAGEMENT screen, NOT a card-entry form. Shows brand + last 4 + expiry only -- never a
      full PAN or CVC, anywhere.
    - Canonical State_PaymentMethodOnFile: card-on-file card (Visa, ·· ·· ·· 4242, Expires
      08 / 27, cardholder), "Replace card" primary button (launches the platform/Stripe
      PaymentSheet), "Remove card" danger-red text button (confirm dialog names the lapse
      date). A caption states that card entry happens in the secure system sheet.
    - Empty variant (State_PaymentMethodEmpty, not rendered here): placeholder + single
      "Add card" button.
    - No bottom nav (detail screen). Back -> entry point (MOB_SETTINGS or MOB_BILLING).
  */
  :root {
    --bg-primary: #0F172A;
    --surface: #1E293B;
    --surface-border: #334155;
    --accent-green: #10B981;
    --warning-amber: #F59E0B;
    --danger-red: #EF4444;
    --purple-analytics: #6D28D9;
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --night-mode: #000000;
    --pressed-surface: #273449;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
  body {
    background-color: #020617;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* IPHONE 17 PRO MAX DEVICE CHROME — 440x956pt logical resolution, shared across all mockups */
  .device-frame {
    width: 440px;
    height: 956px;
    background-color: var(--bg-primary);
    border-radius: 55px;
    border: 8px solid #0B1220;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--text-primary);
  }
  .status-bar {
    flex: 0 0 auto;
    height: 59px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 28px 10px 28px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    position: relative;
    z-index: 2;
  }
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    border-radius: 19px;
    background: #000;
    z-index: 3;
  }
  .status-bar .clock { letter-spacing: 0.01em; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }
  .status-bar .icons svg { display: block; }
  .screen-content {
    flex: 1 1 auto;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .home-indicator {
    flex: 0 0 auto;
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }
  .home-indicator .bar {
    width: 148px;
    height: 5px;
    border-radius: 999px;
    background: rgba(248,250,252,0.7);
  }
  .device-frame.night-mode { background-color: var(--night-mode); }
  .device-frame.night-mode .home-indicator .bar { background: rgba(148,163,184,0.35); }

  /* ---- Screen-specific CSS (MOB_PAYMENT_METHOD) ---- */
  .app-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 22px 20px 12px;
  }
  .app-bar .back { font-size: 26px; line-height: 1; color: var(--text-primary); width: 22px; }
  .app-bar .title { font-size: 18px; font-weight: 600; color: var(--text-primary); }
  .app-content {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 8px 20px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  /* PaymentMethodCard (DESIGN.md Components #6b) */
  .pm-card {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .pm-row1 { display: flex; align-items: center; gap: 12px; }
  .pm-brand {
    font-size: 12px; font-weight: 800; letter-spacing: 0.06em;
    color: #F8FAFC; background: #1D4ED8; border-radius: 4px; padding: 3px 8px;
  }
  .pm-number { font-size: 16px; color: var(--text-primary); font-variant-numeric: tabular-nums; letter-spacing: 0.06em; }
  .pm-row2 { display: flex; align-items: baseline; justify-content: space-between; }
  .pm-row2 .pm-exp { font-size: 13px; color: var(--text-secondary); }
  .pm-row2 .pm-holder { font-size: 13px; color: var(--text-secondary); }

  .btn-primary {
    width: 100%;
    min-height: 48px;
    background-color: var(--accent-green);
    color: var(--bg-primary);
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 700;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  .btn-danger-text {
    align-self: flex-start;
    background: none;
    border: none;
    padding: 8px 0;
    font-size: 14px;
    font-weight: 600;
    color: var(--danger-red);
  }
  .secure-note {
    display: flex;
    gap: 8px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary);
    margin-top: 2px;
  }
  .secure-note svg { width: 14px; height: 14px; flex: 0 0 auto; margin-top: 1px; }
</style>
</head>
<body>
  <div class="device-frame">
    <div class="status-bar">
      <div class="dynamic-island"></div>
      <span class="clock">21:41</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 10.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM4.2 6.3a5.4 5.4 0 017.6 0l-1.4 1.4a3.4 3.4 0 00-4.8 0L4.2 6.3zM1.4 3.5a9.4 9.4 0 0113.2 0L13.2 5A7.4 7.4 0 008 3a7.4 7.4 0 00-5.2 2L1.4 3.5z"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg>
      </span>
    </div>
    <div class="screen-content">
      <div class="app-bar">
        <span class="back">‹</span>
        <span class="title">Payment Method</span>
      </div>

      <div class="app-content">
        <div class="pm-card">
          <div class="pm-row1">
            <span class="pm-brand">VISA</span>
            <span class="pm-number">&middot;&middot;&nbsp;&middot;&middot;&nbsp;&middot;&middot;&nbsp;4242</span>
          </div>
          <div class="pm-row2">
            <span class="pm-exp">Expires 08 / 27</span>
            <span class="pm-holder">D. Chen</span>
          </div>
        </div>

        <button class="btn-primary">Replace card</button>
        <button class="btn-danger-text">Remove card</button>

        <p class="secure-note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          Card details are entered in your device's secure payment sheet. This app only stores your card brand, last 4 digits, and expiry.
        </p>
      </div>
    </div>
    <div class="home-indicator"><span class="bar"></span></div>
  </div>
</body>
</html>
