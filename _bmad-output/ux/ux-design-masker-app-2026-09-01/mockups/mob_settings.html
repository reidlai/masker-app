<!-- SHARED TEMPLATE — iPhone 17 Pro Max standard artboard (440x956 pt logical resolution).
     Do not alter the chrome markup/CSS below (.device-frame, .status-bar, .dynamic-island, .home-indicator).
     Every mockup embeds this verbatim so the set reads as one consistent iPhone. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Sleep Apnea Detection App</title>
<style>
  /*
    MOB_SETTINGS illustrates (fully explicit spec, see EXPERIENCE.md "Settings Screen
    (MOB_SETTINGS)" section and State Patterns #8 State_SettingsDefault):
    - App bar: back affordance (‹) + title "Settings" (EXPERIENCE.md §Settings Screen).
    - Single vertical list of SettingsMenuRow(s) grouped on a glassmorphic surface card
      (DESIGN.md Components #6 SettingsMenuRow; EXPERIENCE.md Component Pattern #5
      SettingsMenuRowOrganism).
    - State_SettingsDefault: debuggingMode == false && developerMode == false (production
      default) -> renders the Profile row ONLY. No "Advanced" SettingsSectionHeader, no
      Debugging/Developer rows -- per DESIGN.md Components #7 SettingsSectionHeader ("rendered
      only when its section contains at least one visible row") and the DO "hide the Advanced
      header whenever both are off."
    - Profile row: navigable variant -- leading person icon, label "Profile" at full-contrast
      text_primary, trailing chevron, min 48dp touch target (DESIGN.md Components #6 /
      EXPERIENCE.md Accessibility Floor "Settings Touch Targets").
    - PrimaryNavBarOrganism with the Settings tab active in accent_green (EXPERIENCE.md
      §Primary Navigation table, row 4; Component Pattern #4).
    Nothing in this screen is thin/inferred -- every element traces to an explicit spec
    passage above.
    - Redrawn on the iPhone 17 Pro Max 440x956 artboard (was 390x844 Android chrome). A
      single-row Profile list on this much larger canvas would otherwise leave a long dead
      strip below the card, so the menu card is vertically centered in the content column
      (still clearly below the app bar) instead of pinned to the top, and the row itself is
      given more generous height/padding to match the frame's scale.
  */
  :root {
    --bg-primary: #0F172A;
    --surface: #1E293B;
    --surface-border: #334155;
    --accent-green: #10B981;
    --warning-amber: #F59E0B;
    --danger-red: #EF4444;
    --purple-analytics: #6D28D9;
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --night-mode: #000000;
    --pressed-surface: #273449;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
  body {
    background-color: #020617;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* IPHONE 17 PRO MAX DEVICE CHROME — 440x956pt logical resolution, shared across all mockups */
  .device-frame {
    width: 440px;
    height: 956px;
    background-color: var(--bg-primary);
    border-radius: 55px;
    border: 8px solid #0B1220;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--text-primary);
  }
  .status-bar {
    flex: 0 0 auto;
    height: 59px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 28px 10px 28px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    position: relative;
    z-index: 2;
  }
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    border-radius: 19px;
    background: #000;
    z-index: 3;
  }
  .status-bar .clock { letter-spacing: 0.01em; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }
  .status-bar .icons svg { display: block; }
  .screen-content {
    flex: 1 1 auto;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .home-indicator {
    flex: 0 0 auto;
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }
  .home-indicator .bar {
    width: 148px;
    height: 5px;
    border-radius: 999px;
    background: rgba(248,250,252,0.7);
  }
  /* Night Mode variant: pure-black screen, chrome stays low-contrast against #000 */
  .device-frame.night-mode { background-color: var(--night-mode); }
  .device-frame.night-mode .home-indicator .bar { background: rgba(148,163,184,0.35); }

  /* ---- Screen-specific CSS (MOB_SETTINGS) ---- */
  .app-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 20px 16px;
  }
  .app-bar .back { font-size: 26px; line-height: 1; color: var(--text-primary); width: 22px; }
  .app-bar .title { font-size: 18px; font-weight: 600; color: var(--text-primary); }
  .app-content {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 0 20px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .menu-card {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    overflow: hidden;
  }
  .settings-menu-row {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 60px;
    padding: 0 18px;
  }
  .settings-menu-row .row-icon { width: 24px; height: 24px; color: var(--text-primary); flex: 0 0 auto; }
  .settings-menu-row .row-label { flex: 1; font-size: 14px; color: var(--text-primary); }
  .settings-menu-row .row-chev { width: 18px; height: 18px; color: var(--text-secondary); flex: 0 0 auto; }

  /* PrimaryNavBarOrganism (shared pattern across post-onboarding tab shells) */
  .primary-nav-bar {
    flex: 0 0 auto;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--surface-border);
    padding: 12px 0 8px;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    color: var(--text-secondary);
  }
  .nav-item.active { color: var(--accent-green); }
  .nav-item svg { width: 24px; height: 24px; }
  .nav-item span { font-size: 12px; font-weight: 500; }
</style>
</head>
<body>

        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg>
      </span>

    <div class="screen-content">

        <div class="menu-card">

            <svg class="row-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>

      <nav class="primary-nav-bar">
        <div class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h4v-6h4v6h4a1 1 0 001-1V10"/></svg>
          <span>Home</span>
        </div>
        <div class="nav-item">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 119.5 4a7 7 0 1010.5 10.5z"/></svg>

          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>

  </div>
</body>
</html>
