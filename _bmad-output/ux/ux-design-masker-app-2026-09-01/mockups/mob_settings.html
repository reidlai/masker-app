<!-- SHARED TEMPLATE — iPhone 17 Pro Max standard artboard (440x956 pt logical resolution).
     Do not alter the chrome markup/CSS below (.device-frame, .status-bar, .dynamic-island, .home-indicator).
     Every mockup embeds this verbatim so the set reads as one consistent iPhone. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings — Sleep Apnea Detection App</title>
<style>
  /*
    MOB_SETTINGS illustrates (see EXPERIENCE.md "Settings Screen (MOB_SETTINGS)", State
    Patterns #8 State_SettingsDefault, DESIGN.md Components #6 SettingsMenuRow / #7
    SettingsSectionHeader):
    - App bar: back affordance (‹) + title "Settings".
    - Grouped list: SettingsSectionHeader + a glassmorphic surface card per group.
      * Account       -> Profile              (navigable)
      * Preferences   -> Language & Region    (value variant, trailing "English")
      * Subscription  -> Billing & subscription (value "Premium") + Payment method
                         (value "Visa ·· 4242", amber status dot = card nearing expiry)
    - State_SettingsDefault: debuggingMode == false && developerMode == false -> the three
      groups above, no "Advanced" header (SettingsSectionHeader renders only above a
      non-empty section; Advanced is conditional on the build flags).
    - PrimaryNavBarOrganism with the Settings tab active in accent_green.
    - iPhone 17 Pro Max 440x956 artboard; list pinned to the top under the app bar.
  */
  :root {
    --bg-primary: #0F172A;
    --surface: #1E293B;
    --surface-border: #334155;
    --accent-green: #10B981;
    --warning-amber: #F59E0B;
    --danger-red: #EF4444;
    --purple-analytics: #6D28D9;
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --night-mode: #000000;
    --pressed-surface: #273449;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
  body {
    background-color: #020617;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* IPHONE 17 PRO MAX DEVICE CHROME — 440x956pt logical resolution, shared across all mockups */
  .device-frame {
    width: 440px;
    height: 956px;
    background-color: var(--bg-primary);
    border-radius: 55px;
    border: 8px solid #0B1220;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--text-primary);
  }
  .status-bar {
    flex: 0 0 auto;
    height: 59px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 28px 10px 28px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    position: relative;
    z-index: 2;
  }
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    border-radius: 19px;
    background: #000;
    z-index: 3;
  }
  .status-bar .clock { letter-spacing: 0.01em; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }
  .status-bar .icons svg { display: block; }
  .screen-content {
    flex: 1 1 auto;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .home-indicator {
    flex: 0 0 auto;
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }
  .home-indicator .bar {
    width: 148px;
    height: 5px;
    border-radius: 999px;
    background: rgba(248,250,252,0.7);
  }
  /* Night Mode variant: pure-black screen, chrome stays low-contrast against #000 */
  .device-frame.night-mode { background-color: var(--night-mode); }
  .device-frame.night-mode .home-indicator .bar { background: rgba(148,163,184,0.35); }

  /* ---- Screen-specific CSS (MOB_SETTINGS) ---- */
  .app-bar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 22px 20px 12px;
  }
  .app-bar .back { font-size: 26px; line-height: 1; color: var(--text-primary); width: 22px; }
  .app-bar .title { font-size: 18px; font-weight: 600; color: var(--text-primary); }
  .app-content {
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 4px 20px 24px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
  }
  .section-header {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-secondary);
    margin: 24px 0 8px;
  }
  .section-header:first-child { margin-top: 4px; }
  .menu-card {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    overflow: hidden;
  }
  .settings-menu-row {
    display: flex;
    align-items: center;
    gap: 14px;
    min-height: 56px;
    padding: 0 18px;
  }
  .settings-menu-row + .settings-menu-row { border-top: 1px solid var(--surface-border); }
  .settings-menu-row .row-icon { width: 22px; height: 22px; color: var(--text-primary); flex: 0 0 auto; }
  .settings-menu-row .row-label { flex: 1; font-size: 14px; color: var(--text-primary); }
  .settings-menu-row .row-value { font-size: 14px; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
  .settings-menu-row .status-dot { width: 6px; height: 6px; border-radius: 999px; background: var(--warning-amber); flex: 0 0 auto; }
  .settings-menu-row .row-chev { width: 18px; height: 18px; color: var(--text-secondary); flex: 0 0 auto; }

  /* PrimaryNavBarOrganism (shared pattern across post-onboarding tab shells) */
  .primary-nav-bar {
    flex: 0 0 auto;
    display: flex;
    background: var(--surface);
    border-top: 1px solid var(--surface-border);
    padding: 12px 0 8px;
  }
  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    color: var(--text-secondary);
  }
  .nav-item.active { color: var(--accent-green); }
  .nav-item svg { width: 24px; height: 24px; }
  .nav-item span { font-size: 12px; font-weight: 500; }
</style>
</head>
<body>

        <div class="menu-card">

</html>
