<!-- SHARED TEMPLATE — iPhone 17 Pro Max standard artboard (440x956 pt logical resolution).
     Do not alter the chrome markup/CSS below (.device-frame, .status-bar, .dynamic-island, .home-indicator).
     Every mockup embeds this verbatim so the set reads as one consistent iPhone. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medical Profile Setup — Sleep Apnea Detection App</title>
<style>
  /* Illustrates: EXPERIENCE.md IA flow map (User Medical Profile Setup, MOB_USER_PROFILE,
     between Passkey Auth and Bluetooth Priming); Settings screen "[NOTE FOR UX]" on Weight/
     Height/Computed BMI + inline Caregiver contacts and the Units cross-dependency (default
     metric); Secondary Flow "David corrects his weight" (Weight field -> live Computed BMI);
     DESIGN.md ShadInput / ShadCard / ShadButton and Typography (h1/body/caption). Canonical
     state rendered is onboarding Setup (Save & Continue advances the wizard). Redrawn on the
     iPhone 17 Pro Max 440x956 artboard: the form now fits without scrolling on the taller
     canvas, so the whole card group (header, both cards, button) is centered as one block
     with wider card padding and section gaps instead of the old scroll container padded thin
     with a bottom-pinned button. */
  :root {
    --bg-primary: #0F172A;
    --surface: #1E293B;
    --surface-border: #334155;
    --accent-green: #10B981;
    --warning-amber: #F59E0B;
    --danger-red: #EF4444;
    --purple-analytics: #6D28D9;
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --night-mode: #000000;
    --pressed-surface: #273449;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
  body {
    background-color: #020617;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* IPHONE 17 PRO MAX DEVICE CHROME — 440x956pt logical resolution, shared across all mockups */
  .device-frame {
    width: 440px;
    height: 956px;
    background-color: var(--bg-primary);
    border-radius: 55px;
    border: 8px solid #0B1220;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--text-primary);
  }
  .status-bar {
    flex: 0 0 auto;
    height: 59px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 28px 10px 28px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    position: relative;
    z-index: 2;
  }
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    border-radius: 19px;
    background: #000;
    z-index: 3;
  }
  .status-bar .clock { letter-spacing: 0.01em; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }
  .status-bar .icons svg { display: block; }
  .screen-content {
    flex: 1 1 auto;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .home-indicator {
    flex: 0 0 auto;
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }
  .home-indicator .bar {
    width: 148px;
    height: 5px;
    border-radius: 999px;
    background: rgba(248,250,252,0.7);
  }
  .device-frame.night-mode { background-color: var(--night-mode); }
  .device-frame.night-mode .home-indicator .bar { background: rgba(148,163,184,0.35); }

  /* ---- Screen-specific: User Profile Setup ---- */
  .up-wrap {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 20px 28px 32px;
    overflow-y: auto;
  }
  .up-header { text-align: left; margin-bottom: 8px; }
  .up-header h1 { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
  .up-header p { font-size: 14px; color: var(--text-secondary); line-height: 1.5; }

  .up-section-label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 24px 0 10px;
  }
  .up-section-label:first-of-type { margin-top: 24px; }

  .up-card {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    padding: 20px;
  }
  .up-field { margin-bottom: 16px; }
  .up-field:last-child { margin-bottom: 0; }
  .up-field label {
    display: block;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 8px;
  }
  .up-input {
    width: 100%;
    min-height: 48px;
    background: var(--bg-primary);
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    padding: 0 16px;
    font-size: 14px;
    color: var(--text-primary);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .up-input .unit { color: var(--text-secondary); font-size: 12px; }

  .up-bmi-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--pressed-surface);
    border: 1px solid var(--surface-border);
    border-radius: 8px;
    padding: 14px 16px;
    margin-top: 6px;
  }
  .up-bmi-row .up-bmi-label { font-size: 12px; color: var(--text-secondary); }
  .up-bmi-row .up-bmi-value {
    font-size: 24px;
    font-weight: 600;
    color: var(--accent-green);
    font-variant-numeric: tabular-nums;
  }
  .up-bmi-row .up-bmi-tag {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-green);
    background: rgba(16,185,129,0.12);
    border-radius: 9999px;
    padding: 3px 10px;
    margin-left: 8px;
  }

  .btn-primary {
    width: 100%;
    min-height: 48px;
    background-color: var(--accent-green);
    color: var(--bg-primary);
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: 700;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-top: 28px;
  }
</style>
</head>
<body>
  <div class="device-frame">
    <div class="status-bar">
      <div class="dynamic-island"></div>
      <span class="clock">10:17</span>
      <span class="icons">
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 10.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM4.2 6.3a5.4 5.4 0 017.6 0l-1.4 1.4a3.4 3.4 0 00-4.8 0L4.2 6.3zM1.4 3.5a9.4 9.4 0 0113.2 0L13.2 5A7.4 7.4 0 008 3a7.4 7.4 0 00-5.2 2L1.4 3.5z"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg>
      </span>
    </div>
    <div class="screen-content">
      <div class="up-wrap">
        <div class="up-header">
          <h1>Medical Profile Setup</h1>
          <p>A few details to personalize your overnight monitoring.</p>
        </div>

        <div class="up-section-label">Body metrics (metric)</div>
        <div class="up-card">
          <div class="up-field">
            <label for="up-weight">Weight</label>
            <div class="up-input" id="up-weight">75 <span class="unit">kg</span></div>
          </div>
          <div class="up-field">
            <label for="up-height">Height</label>
            <div class="up-input" id="up-height">178 <span class="unit">cm</span></div>
          </div>
          <div class="up-bmi-row">
            <span class="up-bmi-label">Computed BMI</span>
            <span>
              <span class="up-bmi-value">23.7</span>
              <span class="up-bmi-tag">Normal</span>
            </span>
          </div>
        </div>

        <div class="up-section-label">Caregiver contact</div>
        <div class="up-card">
          <div class="up-field">
            <label for="up-cg-name">Caregiver name</label>
            <div class="up-input" id="up-cg-name">Maria Chen</div>
          </div>
          <div class="up-field">
            <label for="up-cg-phone">Caregiver phone</label>
            <div class="up-input" id="up-cg-phone">(555) 019-2244</div>
          </div>
        </div>

        <button class="btn-primary">Save &amp; Continue</button>
      </div>
    </div>
    <div class="home-indicator"><span class="bar"></span></div>
  </div>
</body>
</html>
