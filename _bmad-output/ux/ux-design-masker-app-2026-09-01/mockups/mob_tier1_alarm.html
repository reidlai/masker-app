<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tier-1 Apnea Siren Overlay — Sleep Apnea App</title>
  <style>
    :root {
      --bg-primary: #0F172A;
      --danger: #EF4444;
      --danger-dark: #DC2626;
      --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
    body {
      background-color: #020617;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }
    .phone-frame {
      width: 390px;
      height: 844px;
      background: linear-gradient(180deg, #7F1D1D 0%, #450A0A 100%);
      border-radius: 48px;
      border: 12px solid #1E293B;
      box-shadow: 0 0 50px rgba(239, 68, 68, 0.6);
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 32px 24px;
      text-align: center;
      animation: flashAlert 1.2s infinite alternate;
    }
    @keyframes flashAlert {
      0% { background: linear-gradient(180deg, #991B1B 0%, #450A0A 100%); }
      100% { background: linear-gradient(180deg, #DC2626 0%, #7F1D1D 100%); }
    }
    .alarm-icon-box {
      width: 100px;
      height: 100px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 40px auto 24px;
      border: 3px solid white;
      animation: pulseIcon 0.8s infinite alternate;
    }
    @keyframes pulseIcon {
      0% { transform: scale(1); }
      100% { transform: scale(1.15); }
    }
    h1.alert-title { font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; }
    p.alert-desc { font-size: 15px; opacity: 0.9; line-height: 1.4; margin-bottom: 32px; }
    
    .timer-circle {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 6px solid rgba(255,255,255,0.3);
      border-top-color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      margin: 0 auto 40px;
    }
    .timer-seconds { font-size: 42px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .timer-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
    
    .btn-safe {
      width: 100%;
      height: 72px;
      background-color: white;
      color: #991B1B;
      border: none;
      border-radius: 20px;
      font-size: 20px;
      font-weight: 800;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.4);
      transition: transform 0.1s;
    }
    .btn-safe:active { transform: scale(0.96); }
    .tier2-warning { font-size: 12px; opacity: 0.8; margin-top: 24px; }
  </style>
</head>
<body>
  <div class="phone-frame">
    <div class="alarm-icon-box">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>

    <h1 class="alert-title">Breathing Pause!</h1>
    <p class="alert-desc">Nocturnal Obstructive Apnea Breach Detected (&gt;10s airflow drop).</p>

    <div class="timer-circle">
      <span class="timer-seconds">28s</span>
      <span class="timer-label">To Cloud Dispatch</span>
    </div>

    <button class="btn-safe" onclick="alert('Alarm Silenced — Patient Confirmed Safe ✓')">
      I'm Safe / I'm Awake
    </button>

    <p class="tier2-warning">
      ⚠️ Tier-2 Caregiver SMS/Voice Call will be dispatched if unacknowledged after 30s.
    </p>
  </div>
</body>
</html>
