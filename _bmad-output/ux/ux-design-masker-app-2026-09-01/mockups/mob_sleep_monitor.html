<!-- SHARED TEMPLATE — iPhone 17 Pro Max standard artboard (440x956 pt logical resolution).
     Do not alter the chrome markup/CSS below (.device-frame, .status-bar, .dynamic-island, .home-indicator).
     Every mockup embeds this verbatim so the set reads as one consistent iPhone. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sleep Monitoring — Night Mode — Sleep Apnea Detection App</title>
<style>
  /* Illustrates: EXPERIENCE.md Component Pattern #1 LiveAirflowMonitorOrganism; State Pattern #4 State_MonitoringActive; Accessibility Floor "Night Mode Accessible State"; Key Flow step 5; DESIGN.md Brand and Style "Night Mode Invariant" + Colors token night_mode. */
  :root {
    --bg-primary: #0F172A;
    --surface: #1E293B;
    --surface-border: #334155;
    --accent-green: #10B981;
    --warning-amber: #F59E0B;
    --danger-red: #EF4444;
    --purple-analytics: #6D28D9;
    --text-primary: #F8FAFC;
    --text-secondary: #94A3B8;
    --night-mode: #000000;
    --pressed-surface: #273449;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font); }
  body {
    background-color: #020617;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  /* IPHONE 17 PRO MAX DEVICE CHROME — 440x956pt logical resolution, shared across all mockups */
  .device-frame {
    width: 440px;
    height: 956px;
    background-color: var(--bg-primary);
    border-radius: 55px;
    border: 8px solid #0B1220;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,0.7);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    color: var(--text-primary);
  }
  .status-bar {
    flex: 0 0 auto;
    height: 59px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 0 28px 10px 28px;
    font-size: 15px;
    font-weight: 600;
    color: var(--text-primary);
    position: relative;
    z-index: 2;
  }
  .dynamic-island {
    position: absolute;
    top: 11px;
    left: 50%;
    transform: translateX(-50%);
    width: 126px;
    height: 37px;
    border-radius: 19px;
    background: #000;
    z-index: 3;
  }
  .status-bar .clock { letter-spacing: 0.01em; }
  .status-bar .icons { display: flex; align-items: center; gap: 6px; }
  .status-bar .icons svg { display: block; }
  .screen-content {
    flex: 1 1 auto;
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .home-indicator {
    flex: 0 0 auto;
    height: 34px;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 2;
  }
  .home-indicator .bar {
    width: 148px;
    height: 5px;
    border-radius: 999px;
    background: rgba(248,250,252,0.7);
  }
  /* Night Mode variant: pure-black screen, chrome stays low-contrast against #000 */
  .device-frame.night-mode { background-color: var(--night-mode); }
  .device-frame.night-mode .home-indicator .bar { background: rgba(148,163,184,0.35); }

  /* SCREEN-SPECIFIC — MOB_SLEEP_MONITOR (0-FPS Night Mode) */
  .night-center {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }
  .heartbeat-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--accent-green);
    animation: dimPulse 2.6s ease-in-out infinite;
  }
  @keyframes dimPulse {
    0%, 100% { opacity: 0.18; }
    50% { opacity: 0.55; }
  }
  .night-label {
    font-size: 11px;
    color: #3F5B52;
    letter-spacing: 0.02em;
    text-align: center;
    max-width: 220px;
  }
</style>
</head>
<body>
  <div class="device-frame night-mode">
    <div class="status-bar">
      <div class="dynamic-island"></div>
      <span class="clock">10:15</span>
      <span class="icons">
        <!-- signal (iOS-style dots ascending) -->
        <svg width="18" height="12" viewBox="0 0 18 12" fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="0.5"/><rect x="5" y="5" width="3" height="7" rx="0.5"/><rect x="10" y="2" width="3" height="10" rx="0.5"/><rect x="15" y="0" width="3" height="12" rx="0.5"/></svg>
        <!-- wifi -->
        <svg width="16" height="12" viewBox="0 0 16 12" fill="currentColor"><path d="M8 10.5a1.5 1.5 0 100-3 1.5 1.5 0 000 3zM4.2 6.3a5.4 5.4 0 017.6 0l-1.4 1.4a3.4 3.4 0 00-4.8 0L4.2 6.3zM1.4 3.5a9.4 9.4 0 0113.2 0L13.2 5A7.4 7.4 0 008 3a7.4 7.4 0 00-5.2 2L1.4 3.5z"/></svg>
        <!-- battery (iOS-style rounded pill) -->
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" opacity="0.5"/><rect x="2" y="2" width="18" height="8" rx="2" fill="currentColor"/><rect x="22.5" y="4" width="2" height="4" rx="1" fill="currentColor" opacity="0.5"/></svg>
      </span>
    </div>
    <div class="screen-content">
      <div class="night-center">
        <span class="heartbeat-dot"></span>
        <span class="night-label">Sleep monitoring active — D-BAND connected</span>
      </div>
    </div>
    <div class="home-indicator"><span class="bar"></span></div>
  </div>
</body>
</html>
