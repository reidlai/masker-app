<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="980" viewBox="0 0 1520 980" version="1.1">
  <defs>
    <style>
      .pool-bg-1 { fill: #F8FAFC; stroke: #475569; stroke-width: 2px; }
      .pool-bg-2 { fill: #F0FDF4; stroke: #166534; stroke-width: 2px; }
      .pool-bg-3 { fill: #EFF6FF; stroke: #1E40AF; stroke-width: 2px; }
      .pool-bg-4 { fill: #FEF2F2; stroke: #991B1B; stroke-width: 2px; }
      
      .pool-header-1 { fill: #334155; }
      .pool-header-2 { fill: #15803D; }
      .pool-header-3 { fill: #1D4ED8; }
      .pool-header-4 { fill: #B91C1C; }

      .header-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 15px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }

      .task-rect { fill: #FFFFFF; stroke: #334155; stroke-width: 2px; rx: 8px; ry: 8px; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.08)); }
      .task-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0F172A; text-anchor: middle; }
      .task-desc { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }

      .gateway { fill: #FEF08A; stroke: #CA8A04; stroke-width: 2px; }
      .gateway-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #854D0E; text-anchor: middle; }

      .event-start { fill: #DCFCE7; stroke: #16A34A; stroke-width: 2.5px; }
      .event-end { fill: #FEE2E2; stroke: #DC2626; stroke-width: 4px; }
      .event-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #1E293B; text-anchor: middle; }

      .flow-path { fill: none; stroke: #334155; stroke-width: 2px; }
      .flow-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #475569; }

      .msg-flow { fill: none; stroke: #64748B; stroke-width: 1.8px; stroke-dasharray: 6 4; }
      .msg-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #2563EB; background-color: #FFFFFF; }
      
      marker { overflow: visible; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-msg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
    <marker id="msg-start" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6">
      <circle cx="5" cy="5" r="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/>
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="10" width="1480" height="40" rx="6" fill="#1E293B" />
  <text x="760" y="35" class="header-text" font-size="17px">End-to-End Sleep Apnea Monitoring &amp; Emergency Escalation BPMN 2.0 Process Architecture</text>

  <!-- ==================== POOL 1: PATIENT AT HOME ==================== -->
  <rect x="20" y="60" width="1480" height="200" class="pool-bg-1" rx="6" />
  <path d="M 20 66 A 6 6 0 0 1 26 60 L 60 60 L 60 260 L 26 260 A 6 6 0 0 1 20 254 Z" class="pool-header-1" />
  <text x="40" y="160" class="header-text" transform="rotate(-90 40 160)">1. Patient at Home</text>

  <!-- Start Event -->
  <circle cx="95" cy="150" r="18" class="event-start" />
  <text x="95" y="183" class="event-text"><tspan x="95" dy="0">Start Bedtime</tspan><tspan x="95" dy="12">Onboarding</tspan></text>

  <!-- Task 1.1 -->
  <rect x="160" y="110" width="125" height="80" class="task-rect" />
  <text x="222" y="132" class="task-title">1.1 Authenticate</text>
  <text x="222" y="146" class="task-desc">Passkey FIDO2</text>
  <text x="222" y="160" class="task-desc">Biometrics</text>

  <!-- Task 1.2 -->
  <rect x="315" y="110" width="125" height="80" class="task-rect" />
  <text x="377" y="132" class="task-title">1.2 Stage 1 Calib.</text>
  <text x="377" y="146" class="task-desc">Idle Noise Floor</text>
  <text x="377" y="160" class="task-desc">Sampling (10s)</text>

  <!-- Task 1.3 -->
  <rect x="470" y="110" width="125" height="80" class="task-rect" />
  <text x="532" y="132" class="task-title">1.3 Stage 2 Calib.</text>
  <text x="532" y="146" class="task-desc">Active Breath Vpp</text>
  <text x="532" y="160" class="task-desc">Baseline (30s)</text>

  <!-- Task 1.4 -->
  <rect x="625" y="110" width="125" height="80" class="task-rect" />
  <text x="687" y="132" class="task-title">1.4 Sleep Monitor</text>
  <text x="687" y="146" class="task-desc">Device Attached</text>
  <text x="687" y="160" class="task-desc">0-FPS Low Power</text>

  <!-- Gateway Tier 1 Alarm -->
  <polygon points="785,150 810,125 835,150 810,175" class="gateway" />
  <text x="810" y="154" class="gateway-text">X</text>
  <text x="810" y="190" class="task-desc" font-weight="bold">Alarm Triggered?</text>

  <!-- Gateway Patient Awake -->
  <polygon points="915,150 940,125 965,150 940,175" class="gateway" />
  <text x="940" y="154" class="gateway-text">X</text>
  <text x="940" y="190" class="task-desc" font-weight="bold">Awake within 30s?</text>

  <!-- Task 1.5 -->
  <rect x="1035" y="110" width="125" height="80" class="task-rect" />
  <text x="1097" y="132" class="task-title">1.5 Tap 'I'm Safe'</text>
  <text x="1097" y="146" class="task-desc">Cancel Siren</text>
  <text x="1097" y="160" class="task-desc">Dismiss Alarm</text>

  <!-- Task 1.6 -->
  <rect x="1190" y="110" width="125" height="80" class="task-rect" />
  <text x="1252" y="132" class="task-title">1.6 End Session</text>
  <text x="1252" y="146" class="task-desc">Morning Summary</text>
  <text x="1252" y="160" class="task-desc">Unpair Sensor</text>

  <!-- End Event Session Complete -->
  <circle cx="1365" cy="150" r="18" class="event-end" />
  <text x="1365" y="183" class="event-text"><tspan x="1365" dy="0">End: Session</tspan><tspan x="1365" dy="12">Complete</tspan></text>

  <!-- End Event Escalated -->
  <circle cx="940" cy="225" r="18" class="event-end" />
  <text x="940" y="253" class="event-text" fill="#991B1B">Escalated to Tier-2</text>

  <!-- Pool 1 Sequence Flows -->
  <path d="M 113 150 L 160 150" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 285 150 L 315 150" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 440 150 L 470 150" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 595 150 L 625 150" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 750 150 L 785 150" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 810 125 L 810 85 L 687 85 L 687 110" class="flow-path" marker-end="url(#arrow)" />
  <text x="745" y="80" class="flow-label">No</text>
  <path d="M 835 150 L 915 150" class="flow-path" marker-end="url(#arrow)" />
  <text x="865" y="145" class="flow-label">Yes</text>
  <path d="M 965 150 L 1035 150" class="flow-path" marker-end="url(#arrow)" />
  <text x="990" y="145" class="flow-label">Yes</text>
  <path d="M 940 175 L 940 207" class="flow-path" marker-end="url(#arrow)" />
  <text x="948" y="195" class="flow-label">No (Timeout)</text>
  <path d="M 1160 150 L 1190 150" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 1315 150 L 1347 150" class="flow-path" marker-end="url(#arrow)" />


  <!-- ==================== POOL 2: MOBILE APPLICATION ENGINE ==================== -->
  <rect x="20" y="290" width="1480" height="200" class="pool-bg-2" rx="6" />
  <path d="M 20 296 A 6 6 0 0 1 26 290 L 60 290 L 60 490 L 26 490 A 6 6 0 0 1 20 484 Z" class="pool-header-2" />
  <text x="40" y="390" class="header-text" transform="rotate(-90 40 390)">2. Mobile Application Engine</text>

  <!-- Start Event -->
  <circle cx="95" cy="390" r="18" class="event-start" />
  <text x="95" y="423" class="event-text"><tspan x="95" dy="0">App Initialized</tspan></text>

  <!-- Task 2.1 -->
  <rect x="160" y="350" width="135" height="80" class="task-rect" />
  <text x="227" y="372" class="task-title">2.1 Register Session</text>
  <text x="227" y="386" class="task-desc">Baseline Payload</text>
  <text x="227" y="400" class="task-desc">Sync to Cloud</text>

  <!-- Task 2.2 -->
  <rect x="330" y="350" width="135" height="80" class="task-rect" />
  <text x="397" y="372" class="task-title">2.2 Stream Webhooks</text>
  <text x="397" y="386" class="task-desc">10s Respiratory</text>
  <text x="397" y="400" class="task-desc">Batch Batches</text>

  <!-- Gateway Airflow Breach -->
  <polygon points="500,390 525,365 550,390 525,415" class="gateway" />
  <text x="525" y="394" class="gateway-text">X</text>
  <text x="525" y="430" class="task-desc" font-weight="bold">Airflow Stop &gt; 10s?</text>

  <!-- Task 2.3 -->
  <rect x="615" y="350" width="135" height="80" class="task-rect" />
  <text x="682" y="372" class="task-title">2.3 Trigger Alarm</text>
  <text x="682" y="386" class="task-desc">Audio &amp; Haptics</text>
  <text x="682" y="400" class="task-desc">(&lt; 200ms Latency)</text>

  <!-- Task 2.4 -->
  <rect x="785" y="350" width="135" height="80" class="task-rect" />
  <text x="852" y="372" class="task-title">2.4 Spawn Timer</text>
  <text x="852" y="386" class="task-desc">30s Cancellation</text>
  <text x="852" y="400" class="task-desc">Token Countdown</text>

  <!-- Task 2.5 -->
  <rect x="955" y="350" width="135" height="80" class="task-rect" />
  <text x="1022" y="372" class="task-title">2.5 Send Emergency</text>
  <text x="1022" y="386" class="task-desc">Transmit GPS &amp; Token</text>
  <text x="1022" y="400" class="task-desc">High-Priority Webhook</text>

  <!-- End Event App Alarm -->
  <circle cx="1145" cy="390" r="18" class="event-end" />
  <text x="1145" y="423" class="event-text">Alarm Handled</text>

  <!-- Pool 2 Sequence Flows -->
  <path d="M 113 390 L 160 390" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 295 390 L 330 390" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 465 390 L 500 390" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 525 365 L 525 325 L 397 325 L 397 350" class="flow-path" marker-end="url(#arrow)" />
  <text x="455" y="320" class="flow-label">No</text>
  <path d="M 550 390 L 615 390" class="flow-path" marker-end="url(#arrow)" />
  <text x="575" y="385" class="flow-label">Yes</text>
  <path d="M 750 390 L 785 390" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 920 390 L 955 390" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 1090 390 L 1127 390" class="flow-path" marker-end="url(#arrow)" />


  <!-- ==================== POOL 3: CLOUD SERVICES ENGINE ==================== -->
  <rect x="20" y="520" width="1480" height="200" class="pool-bg-3" rx="6" />
  <path d="M 20 526 A 6 6 0 0 1 26 520 L 60 520 L 60 720 L 26 720 A 6 6 0 0 1 20 714 Z" class="pool-header-3" />
  <text x="40" y="620" class="header-text" transform="rotate(-90 40 620)">3. Cloud Services Engine</text>

  <!-- Start Event -->
  <circle cx="95" cy="620" r="18" class="event-start" />
  <text x="95" y="653" class="event-text"><tspan x="95" dy="0">Ingest Triggered</tspan></text>

  <!-- Task 3.1 -->
  <rect x="160" y="580" width="135" height="80" class="task-rect" />
  <text x="227" y="602" class="task-title">3.1 Pub/Sub Ingest</text>
  <text x="227" y="616" class="task-desc">Cloud Event Ingest</text>
  <text x="227" y="630" class="task-desc">JWT Auth Verification</text>

  <!-- Task 3.2 -->
  <rect x="330" y="580" width="135" height="80" class="task-rect" />
  <text x="397" y="602" class="task-title">3.2 Cloud Run Worker</text>
  <text x="397" y="616" class="task-desc">AASM Stream Rules</text>
  <text x="397" y="630" class="task-desc">Evaluation Engine</text>

  <!-- Task 3.3 -->
  <rect x="500" y="580" width="135" height="80" class="task-rect" />
  <text x="567" y="602" class="task-title">3.3 Write Persistence</text>
  <text x="567" y="616" class="task-desc">Bigtable Bio-Signals</text>
  <text x="567" y="630" class="task-desc">Firestore Session</text>

  <!-- Task 3.4 -->
  <rect x="670" y="580" width="135" height="80" class="task-rect" />
  <text x="737" y="602" class="task-title">3.4 Queue Emergency</text>
  <text x="737" y="616" class="task-desc">High-Priority Alert</text>
  <text x="737" y="630" class="task-desc">Unacknowledged Doc</text>

  <!-- Task 3.5 -->
  <rect x="840" y="580" width="135" height="80" class="task-rect" />
  <text x="907" y="602" class="task-title">3.5 Broadcast WSS</text>
  <text x="907" y="616" class="task-desc">Push Sub-1.5s Frame</text>
  <text x="907" y="630" class="task-desc">Command Portal</text>

  <!-- End Event Ingest Processed -->
  <circle cx="1030" cy="620" r="18" class="event-end" />
  <text x="1030" y="653" class="event-text">Ingest Processed</text>

  <!-- Pool 3 Sequence Flows -->
  <path d="M 113 620 L 160 620" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 295 620 L 330 620" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 465 620 L 500 620" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 635 620 L 670 620" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 805 620 L 840 620" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 975 620 L 1012 620" class="flow-path" marker-end="url(#arrow)" />


  <!-- ==================== POOL 4: 24/7 EMERGENCY COMMAND CENTER ==================== -->
  <rect x="20" y="750" width="1480" height="200" class="pool-bg-4" rx="6" />
  <path d="M 20 756 A 6 6 0 0 1 26 750 L 60 750 L 60 950 L 26 950 A 6 6 0 0 1 20 944 Z" class="pool-header-4" />
  <text x="40" y="850" class="header-text" transform="rotate(-90 40 850)">4. Command Center &amp; Clinic</text>

  <!-- Start Event -->
  <circle cx="95" cy="850" r="18" class="event-start" />
  <text x="95" y="883" class="event-text"><tspan x="95" dy="0">WSS Alert Recv</tspan></text>

  <!-- Task 4.1 -->
  <rect x="160" y="810" width="135" height="80" class="task-rect" />
  <text x="227" y="832" class="task-title">4.1 Dashboard Alert</text>
  <text x="227" y="846" class="task-desc">Red Alert Modal Pop</text>
  <text x="227" y="860" class="task-desc">Audio Siren Chime</text>

  <!-- Task 4.2 -->
  <rect x="330" y="810" width="135" height="80" class="task-rect" />
  <text x="397" y="832" class="task-title">4.2 Verify GPS</text>
  <text x="397" y="846" class="task-desc">Reverse Geocode</text>
  <text x="397" y="860" class="task-desc">Lock Patient Location</text>

  <!-- Task 4.3 -->
  <rect x="500" y="810" width="135" height="80" class="task-rect" />
  <text x="567" y="832" class="task-title">4.3 Caregiver Call</text>
  <text x="567" y="846" class="task-desc">Twilio Voice &amp; SMS</text>
  <text x="567" y="860" class="task-desc">Family Alert</text>

  <!-- Task 4.4 -->
  <rect x="670" y="810" width="135" height="80" class="task-rect" />
  <text x="737" y="832" class="task-title">4.4 Doctor Sync</text>
  <text x="737" y="846" class="task-desc">FCM High Priority Push</text>
  <text x="737" y="860" class="task-desc">Attending Physician</text>

  <!-- Gateway EMS Dispatch -->
  <polygon points="840,850 865,825 890,850 865,875" class="gateway" />
  <text x="865" y="854" class="gateway-text">X</text>
  <text x="865" y="890" class="task-desc" font-weight="bold">Caregiver Responds?</text>

  <!-- End Event Caregiver Handled -->
  <circle cx="950" cy="790" r="18" class="event-end" />
  <text x="950" y="820" class="event-text">Resolved by Caregiver</text>

  <!-- Task 4.5 -->
  <rect x="940" y="855" width="135" height="80" class="task-rect" />
  <text x="1007" y="877" class="task-title">4.5 Dispatch EMS</text>
  <text x="1007" y="891" class="task-desc">911 CAD Integration</text>
  <text x="1007" y="905" class="task-desc">Emergency Responders</text>

  <!-- End Event Event Resolved -->
  <circle cx="1130" cy="895" r="18" class="event-end" />
  <text x="1130" y="928" class="event-text">Emergency Documented</text>

  <!-- Pool 4 Sequence Flows -->
  <path d="M 113 850 L 160 850" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 295 850 L 330 850" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 465 850 L 500 850" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 635 850 L 670 850" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 805 850 L 840 850" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 865 825 L 865 790 L 932 790" class="flow-path" marker-end="url(#arrow)" />
  <text x="875" y="805" class="flow-label">Yes</text>
  <path d="M 865 875 L 865 895 L 940 895" class="flow-path" marker-end="url(#arrow)" />
  <text x="875" y="890" class="flow-label">No</text>
  <path d="M 1075 895 L 1112 895" class="flow-path" marker-end="url(#arrow)" />


  <!-- ==================== CROSS-POOL MESSAGE FLOWS ==================== -->
  <!-- 1. BLE Telemetry Stream (Pool 1 -> Pool 2) -->
  <path d="M 687 190 L 687 270 L 397 270 L 397 350" class="msg-flow" marker-start="url(#msg-start)" marker-end="url(#arrow-msg)" />
  <rect x="490" y="260" width="190" height="20" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" />
  <text x="585" y="274" class="msg-label" text-anchor="middle">100ms BLE Telemetry Stream</text>

  <!-- 2. Webhook Stream (Pool 2 -> Pool 3) -->
  <path d="M 397 430 L 397 500 L 227 500 L 227 580" class="msg-flow" marker-start="url(#msg-start)" marker-end="url(#arrow-msg)" />
  <rect x="250" y="490" width="180" height="20" rx="3" fill="#FFFFFF" stroke="#2563EB" stroke-width="1" />
  <text x="340" y="504" class="msg-label" text-anchor="middle">10s Batch Telemetry Webhook</text>

  <!-- 3. High-Priority Emergency Payload (Pool 2 -> Pool 3) -->
  <path d="M 1022 430 L 1022 500 L 737 500 L 737 580" class="msg-flow" marker-start="url(#msg-start)" marker-end="url(#arrow-msg)" />
  <rect x="800" y="490" width="200" height="20" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2" />
  <text x="900" y="504" class="msg-label" fill="#DC2626" text-anchor="middle">High-Priority Emergency Payload</text>

  <!-- 4. Sub-1.5s WSS Dashboard Alert (Pool 3 -> Pool 4) -->
  <path d="M 907 660 L 907 730 L 227 730 L 227 810" class="msg-flow" marker-start="url(#msg-start)" marker-end="url(#arrow-msg)" />
  <rect x="490" y="720" width="200" height="20" rx="3" fill="#FFFFFF" stroke="#DC2626" stroke-width="1.2" />
  <text x="590" y="734" class="msg-label" fill="#DC2626" text-anchor="middle">Sub-1.5s WSS Dashboard Alert</text>

</svg>