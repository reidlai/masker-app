<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1470" viewBox="0 0 1680 1470" version="1.1">
  <defs>
    <style>
      .pool-bg-1 { fill: #FDF4FF; stroke: #7E22CE; stroke-width: 2px; }
      .pool-bg-2 { fill: #FFFBEB; stroke: #B45309; stroke-width: 2px; }
      .pool-bg-3 { fill: #F8FAFC; stroke: #475569; stroke-width: 2px; }
      .pool-bg-4 { fill: #FEF2F2; stroke: #991B1B; stroke-width: 2px; }
      .pool-bg-5 { fill: #F0FDF4; stroke: #166534; stroke-width: 2px; stroke-dasharray: 6 4; }
      .pool-bg-6 { fill: #EFF6FF; stroke: #1D4ED8; stroke-width: 2px; }
      .pool-bg-7 { fill: #F5F3FF; stroke: #6D28D9; stroke-width: 2px; }
      
      .pool-header-1 { fill: #6B21A8; }
      .pool-header-2 { fill: #92400E; }
      .pool-header-3 { fill: #334155; }
      .pool-header-4 { fill: #B91C1C; }
      .pool-header-5 { fill: #15803D; }
      .pool-header-6 { fill: #1E40AF; }
      .pool-header-7 { fill: #5B21B6; }

      .header-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 14px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }

      .task-rect { fill: #FFFFFF; stroke: #334155; stroke-width: 2px; rx: 8px; ry: 8px; filter: drop-shadow(0px 2px 3px rgba(0,0,0,0.08)); }
      .task-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #0F172A; text-anchor: middle; }
      .task-desc { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #475569; text-anchor: middle; }

      .gateway { fill: #FEF08A; stroke: #CA8A04; stroke-width: 2px; }
      .gateway-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #854D0E; text-anchor: middle; }

      .event-start { fill: #DCFCE7; stroke: #16A34A; stroke-width: 2.5px; }
      .event-end { fill: #FEE2E2; stroke: #DC2626; stroke-width: 4px; }
      .event-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10.5px; font-weight: 600; fill: #1E293B; text-anchor: middle; }

      .flow-path { fill: none; stroke: #334155; stroke-width: 2px; }
      .flow-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #475569; }

      .msg-flow { fill: none; stroke: #64748B; stroke-width: 1.8px; stroke-dasharray: 6 4; }
      .msg-label { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; font-weight: bold; fill: #B45309; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155" />
    </marker>
    <marker id="arrow-msg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#B45309" />
    </marker>
  </defs>

  <!-- Title Banner -->
  <rect x="20" y="10" width="1640" height="40" rx="6" fill="#1E293B" />
  <text x="840" y="35" class="header-text" font-size="17px">End-to-End Sleep Apnea Monitoring Business Operations BPMN 2.0 Process Architecture</text>

  <!-- ==================== POOL 1: PATIENT ONBOARDING ==================== -->
  <rect x="20" y="60" width="1640" height="170" class="pool-bg-1" rx="6" />
  <path d="M 20 66 A 6 6 0 0 1 26 60 L 60 60 L 60 230 L 26 230 A 6 6 0 0 1 20 224 Z" class="pool-header-1" />
  <text x="40" y="145" class="header-text" transform="rotate(-90 40 145)">Patient Onboarding</text>

  <circle cx="85" cy="145" r="16" class="event-start" />
  <text x="85" y="175" class="event-text"><tspan x="85" dy="0">Start: App</tspan><tspan x="85" dy="11">Launch</tspan></text>

  <rect x="135" y="105" width="135" height="80" class="task-rect" />
  <text x="202" y="125" class="task-title">Register Account</text>
  <text x="202" y="139" class="task-desc">Create Credentials</text>
  <text x="202" y="153" class="task-desc">&amp; Consent</text>

  <rect x="295" y="105" width="145" height="80" class="task-rect" />
  <text x="367" y="125" class="task-title">Create User Profile</text>
  <text x="367" y="139" class="task-desc">Demographics &amp;</text>
  <text x="367" y="153" class="task-desc">Caregiver Contact</text>

  <rect x="465" y="105" width="145" height="80" class="task-rect" />
  <text x="537" y="125" class="task-title">Register Passkey</text>
  <text x="537" y="139" class="task-desc">Enroll FIDO2</text>
  <text x="537" y="153" class="task-desc">Biometrics</text>

  <circle cx="655" cy="145" r="16" class="event-end" />
  <text x="655" y="175" class="event-text">Complete</text>

  <path d="M 101 145 L 135 145" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 270 145 L 295 145" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 440 145 L 465 145" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 610 145 L 639 145" class="flow-path" marker-end="url(#arrow)" />

  <!-- ==================== POOL 2: BACKOFFICE OPERATIONS ==================== -->
  <rect x="20" y="240" width="1640" height="170" class="pool-bg-2" rx="6" />
  <path d="M 20 246 A 6 6 0 0 1 26 240 L 60 240 L 60 410 L 26 410 A 6 6 0 0 1 20 404 Z" class="pool-header-2" />
  <text x="40" y="325" class="header-text" transform="rotate(-90 40 325)">Backoffice Operations</text>

  <circle cx="202" cy="325" r="16" class="event-start" />
  <text x="202" y="355" class="event-text"><tspan x="202" dy="0">Registration</tspan><tspan x="202" dy="11">Trigger</tspan></text>

  <rect x="250" y="285" width="145" height="80" class="task-rect" />
  <text x="322" y="305" class="task-title">Verify Identity</text>
  <text x="322" y="319" class="task-desc">Check HIPAA Eligibility</text>
  <text x="322" y="333" class="task-desc">&amp; Account Status</text>

  <rect x="420" y="285" width="145" height="80" class="task-rect" />
  <text x="492" y="305" class="task-title">Bind Medical Device</text>
  <text x="492" y="319" class="task-desc">Pair Hardware Sensor</text>
  <text x="492" y="333" class="task-desc">Serial Number</text>

  <rect x="590" y="285" width="155" height="80" class="task-rect" />
  <text x="667" y="305" class="task-title">Lock Caregivers</text>
  <text x="667" y="319" class="task-desc">Verify Emergency Contacts</text>
  <text x="667" y="333" class="task-desc">(Physician = Future)</text>

  <circle cx="790" cy="325" r="16" class="event-end" />
  <text x="790" y="355" class="event-text">Provisioned</text>

  <path d="M 218 325 L 250 325" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 395 325 L 420 325" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 565 325 L 590 325" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 745 325 L 774 325" class="flow-path" marker-end="url(#arrow)" />

  <path d="M 367 185 L 367 285" class="msg-flow" marker-end="url(#arrow-msg)" />
  <text x="375" y="225" class="msg-label">Patient Medical Profile</text>

  <!-- ==================== POOL 3: PATIENT SLEEP OPERATIONS ==================== -->
  <rect x="20" y="420" width="1640" height="200" class="pool-bg-3" rx="6" />
  <path d="M 20 426 A 6 6 0 0 1 26 420 L 60 420 L 60 620 L 26 620 A 6 6 0 0 1 20 614 Z" class="pool-header-3" />
  <text x="40" y="520" class="header-text" transform="rotate(-90 40 520)">Patient Sleep Operations</text>

  <circle cx="85" cy="520" r="16" class="event-start" />
  <text x="85" y="550" class="event-text"><tspan x="85" dy="0">Start: Bedtime</tspan><tspan x="85" dy="11">Session</tspan></text>

  <rect x="537" y="480" width="135" height="80" class="task-rect" />
  <text x="604" y="500" class="task-title">Authenticate</text>
  <text x="604" y="514" class="task-desc">Passkey FIDO2</text>
  <text x="604" y="528" class="task-desc">Biometrics Login</text>

  <rect x="695" y="480" width="120" height="80" class="task-rect" />
  <text x="755" y="500" class="task-title">Stage 1 Calib.</text>
  <text x="755" y="514" class="task-desc">Idle Noise Floor</text>
  <text x="755" y="528" class="task-desc">Sampling (10s)</text>

  <rect x="835" y="480" width="120" height="80" class="task-rect" />
  <text x="895" y="500" class="task-title">Stage 2 Calib.</text>
  <text x="895" y="514" class="task-desc">Active Breath Vpp</text>
  <text x="895" y="528" class="task-desc">Baseline (30s)</text>

  <rect x="975" y="480" width="120" height="80" class="task-rect" />
  <text x="1035" y="500" class="task-title">Sleep Monitor</text>
  <text x="1035" y="514" class="task-desc">Device Attached</text>
  <text x="1035" y="528" class="task-desc">0-FPS Low Power</text>

  <polygon points="1120,520 1140,500 1160,520 1140,540" class="gateway" />
  <text x="1140" y="524" class="gateway-text">X</text>
  <text x="1140" y="555" class="task-desc" font-weight="bold">Alarm?</text>

  <polygon points="1215,520 1235,500 1255,520 1235,540" class="gateway" />
  <text x="1235" y="524" class="gateway-text">X</text>
  <text x="1235" y="555" class="task-desc" font-weight="bold">Awake &lt;30s?</text>

  <rect x="1290" y="480" width="120" height="80" class="task-rect" />
  <text x="1350" y="500" class="task-title">Tap 'I'm Safe'</text>
  <text x="1350" y="514" class="task-desc">Cancel Siren</text>
  <text x="1350" y="528" class="task-desc">Dismiss Alarm</text>

  <rect x="1430" y="480" width="120" height="80" class="task-rect" />
  <text x="1490" y="500" class="task-title">End Session</text>
  <rect x="20" y="1250" width="1640" height="200" class="pool-bg-7" rx="6" />
  <path d="M 20 1256 A 6 6 0 0 1 26 1250 L 60 1250 L 60 1440 L 26 1440 A 6 6 0 0 1 20 1434 Z" class="pool-header-7" />
  <text x="40" y="1350" class="header-text" transform="rotate(-90 40 1350)">Analytics &amp; Data Pipeline</text>

  <path d="M 1160 520 L 1215 520" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 815 520 L 835 520" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 955 520 L 975 520" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 1095 520 L 1120 520" class="flow-path" marker-end="url(#arrow)" />


  <path d="M 1140 500 L 1140 460 L 1035 460 L 1035 480" class="flow-path" marker-end="url(#arrow)" />
  <text x="1085" y="472" class="flow-label">No</text>

  <path d="M 1255 520 L 1290 520" class="flow-path" marker-end="url(#arrow)" />
  <text x="1265" y="512" class="flow-label">Yes</text>

  <path d="M 1410 520 L 1430 520" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 1550 520 L 1569 520" class="flow-path" marker-end="url(#arrow)" />

  <!-- Message flow to Emergency Center -->
  <path d="M 1235 540 L 1097 690" class="msg-flow" marker-end="url(#arrow-msg)" />
  <text x="1175" y="620" class="msg-label">30s Unacknowledged Alarm Push</text>

  <!-- ==================== POOL 4: EMERGENCY CENTER ==================== -->
  <rect x="20" y="630" width="1640" height="200" class="pool-bg-4" rx="6" />
  <path d="M 20 636 A 6 6 0 0 1 26 630 L 60 630 L 60 830 L 26 830 A 6 6 0 0 1 20 824 Z" class="pool-header-4" />
  <text x="40" y="730" class="header-text" transform="rotate(-90 40 730)">Emergency Center</text>

  <circle cx="980" cy="730" r="16" class="event-start" />
  <text x="980" y="760" class="event-text"><tspan x="980" dy="0">Start: 30s Apnea</tspan><tspan x="980" dy="11">Alarm Trigger</tspan></text>

  <rect x="1035" y="690" width="125" height="80" class="task-rect" />
  <text x="1097" y="710" class="task-title">Dashboard Alert</text>
  <text x="1097" y="724" class="task-desc">Modal Pop-up &amp; Chime</text>

  <rect x="1185" y="690" width="125" height="80" class="task-rect" />
  <text x="1247" y="710" class="task-title">Metric Collection</text>
  <text x="1247" y="724" class="task-desc">Log Response Times &amp;</text>
  <text x="1247" y="738" class="task-desc">Telephony SLA Metrics</text>

  <rect x="1335" y="690" width="125" height="80" class="task-rect" />
  <text x="1397" y="710" class="task-title">Caregiver Call</text>
  <text x="1397" y="724" class="task-desc">Twilio Voice &amp; SMS</text>

  <rect x="1485" y="690" width="125" height="80" class="task-rect" />
  <text x="1547" y="710" class="task-title">Dispatch EMS</text>
  <text x="1547" y="724" class="task-desc">911 CAD Escalation</text>

  <circle cx="1640" cy="730" r="16" class="event-end" />
  <text x="1640" y="760" class="event-text">Resolved</text>

  <path d="M 996 730 L 1035 730" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 1160 730 L 1185 730" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 1310 730 L 1335 730" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 1460 730 L 1485 730" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 1610 730 L 1624 730" class="flow-path" marker-end="url(#arrow)" />

  <!-- ==================== POOL 5: CLINIC & PHYSICIAN [FUTURE] ==================== -->
  <rect x="20" y="840" width="1640" height="180" class="pool-bg-5" rx="6" />
  <path d="M 20 846 A 6 6 0 0 1 26 840 L 60 840 L 60 1020 L 26 1020 A 6 6 0 0 1 20 1014 Z" class="pool-header-5" />
  <text x="40" y="930" class="header-text" transform="rotate(-90 40 930)">Clinic &amp; Physician [Future]</text>

  <circle cx="1370" cy="930" r="16" class="event-start" opacity="0.6" />
  <text x="1370" y="960" class="event-text" opacity="0.7"><tspan x="1370" dy="0">Morning Report</tspan><tspan x="1370" dy="11">Trigger</tspan></text>

  <rect x="1430" y="890" width="135" height="80" class="task-rect" stroke-dasharray="4 3" opacity="0.8" />
  <text x="1497" y="910" class="task-title">Doctor Sync [Future]</text>
  <text x="1497" y="924" class="task-desc">Morning Sleep Reports</text>

  <circle cx="1610" cy="930" r="16" class="event-end" opacity="0.6" />
  <text x="1610" y="960" class="event-text" opacity="0.7">Updated</text>

  <path d="M 1386 930 L 1430 930" class="flow-path" stroke-dasharray="4 3" marker-end="url(#arrow)" />
  <path d="M 1565 930 L 1594 930" class="flow-path" stroke-dasharray="4 3" marker-end="url(#arrow)" />

  <!-- ==================== POOL 6: DEVICE LOSS & MOBILE RECOVERY OPERATIONS ==================== -->
  <rect x="20" y="1040" width="1640" height="190" class="pool-bg-6" rx="6" />
  <path d="M 20 1046 A 6 6 0 0 1 26 1040 L 60 1040 L 60 1230 L 26 1230 A 6 6 0 0 1 20 1224 Z" class="pool-header-6" />
  <text x="40" y="1135" class="header-text" transform="rotate(-90 40 1135)">Device &amp; Mobile Lost Operations</text>

  <circle cx="100" cy="1135" r="16" class="event-start" />
  <text x="100" y="1165" class="event-text"><tspan x="100" dy="0">Start: Device/Mobile</tspan><tspan x="100" dy="11">Lost Reported</tspan></text>

  <rect x="160" y="1095" width="145" height="80" class="task-rect" />
  <text x="232" y="1115" class="task-title">Report Sensor Lost</text>
  <text x="232" y="1129" class="task-desc">Unbind D-BAND Serial &amp;</text>
  <text x="232" y="1143" class="task-desc">Blacklist MAC Address</text>

  <rect x="340" y="1095" width="145" height="80" class="task-rect" />
  <text x="412" y="1115" class="task-title">Report Mobile Lost</text>
  <text x="412" y="1129" class="task-desc">Revoke JWT Sessions &amp;</text>
  <text x="412" y="1143" class="task-desc">Invalidate Passkey Tokens</text>

  <rect x="520" y="1095" width="155" height="80" class="task-rect" />
  <text x="597" y="1115" class="task-title">Trigger Remote Wipe</text>
  <text x="597" y="1129" class="task-desc">Sub-1s Zeroization of</text>
  <text x="597" y="1143" class="task-desc">Local DB &amp; Enclave Keys</text>

  <rect x="710" y="1095" width="155" height="80" class="task-rect" />
  <text x="787" y="1115" class="task-title">Rebind Replacement</text>
  <text x="787" y="1129" class="task-desc">Pair New D-BAND Hardware</text>
  <text x="787" y="1143" class="task-desc">&amp; Retain Cloud History</text>

  <circle cx="910" cy="1135" r="16" class="event-end" />
  <text x="910" y="1165" class="event-text">Recovery Complete</text>

  <path d="M 116 1135 L 160 1135" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 305 1135 L 340 1135" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 485 1135 L 520 1135" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 675 1135 L 710 1135" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 865 1135 L 894 1135" class="flow-path" marker-end="url(#arrow)" />

  <!-- ==================== POOL 7: MOBILE DASHBOARD REVIEW & ANALYTICS ==================== -->
  <rect x="20" y="1250" width="1640" height="190" class="pool-bg-7" rx="6" />
  <path d="M 20 1256 A 6 6 0 0 1 26 1250 L 60 1250 L 60 1440 L 26 1440 A 6 6 0 0 1 20 1434 Z" class="pool-header-7" />
  <text x="40" y="1345" class="header-text" transform="rotate(-90 40 1345)">Mobile Dashboard Review &amp; Analytics</text>

  <circle cx="100" cy="1345" r="16" class="event-start" />
  <text x="100" y="1375" class="event-text"><tspan x="100" dy="0">Start: Session Ended /</tspan><tspan x="100" dy="11">App Open</tspan></text>

  <rect x="160" y="1305" width="155" height="80" class="task-rect" />
  <text x="237" y="1325" class="task-title">Review Morning Summary</text>
  <text x="237" y="1339" class="task-desc">Display AHI Score,</text>
  <text x="237" y="1353" class="task-desc">Duration &amp; Quality Score</text>

  <rect x="355" y="1305" width="165" height="80" class="task-rect" />
  <text x="437" y="1325" class="task-title">Inspect Waveform &amp; FFT</text>
  <text x="437" y="1339" class="task-desc">Skia 60 FPS GPU Wave,</text>
  <text x="437" y="1353" class="task-desc">Spectral Peaks &amp; Apnea</text>

  <rect x="560" y="1305" width="155" height="80" class="task-rect" />
  <text x="637" y="1325" class="task-title">Filter History &amp; Trends</text>
  <text x="637" y="1339" class="task-desc">Date Range &amp; Severity</text>
  <text x="637" y="1353" class="task-desc">AHI Trend Analytics</text>

  <rect x="755" y="1305" width="155" height="80" class="task-rect" />
  <text x="832" y="1325" class="task-title">Export Doctor Report</text>
  <text x="832" y="1339" class="task-desc">Signed FHIR JSON / PDF</text>
  <text x="832" y="1353" class="task-desc">Physician Chart Share</text>

  <circle cx="950" cy="1345" r="16" class="event-end" />
  <text x="950" y="1375" class="event-text">Review Complete</text>

  <path d="M 116 1345 L 160 1345" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 315 1345 L 355 1345" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 520 1345 L 560 1345" class="flow-path" marker-end="url(#arrow)" />
  <path d="M 715 1345 L 755 1345" class="flow-path" marker-end="url(#arrow)" />
