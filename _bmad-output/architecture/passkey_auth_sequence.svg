<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" version="1.1">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .box-client { fill: #F0FDF4; stroke: #166534; stroke-width: 1.5px; rx: 6px; }
      .box-server { fill: #EFF6FF; stroke: #1D4ED8; stroke-width: 1.5px; rx: 6px; }
      
      .actor-head { fill: #F8FAFC; stroke: #0F172A; stroke-width: 2px; }
      .actor-body { stroke: #0F172A; stroke-width: 2px; stroke-linecap: round; }

      .participant-ui { fill: #15803D; stroke: #166534; stroke-width: 1.5px; rx: 6px; }
      .participant-enclave { fill: #166534; stroke: #14532D; stroke-width: 1.5px; rx: 6px; }
      .participant-gw { fill: #1D4ED8; stroke: #1E40AF; stroke-width: 1.5px; rx: 6px; }
      .participant-auth { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1.5px; rx: 6px; }
      .participant-audit { fill: #1E40AF; stroke: #1E3A8A; stroke-width: 1.5px; rx: 6px; }
      .participant-db { fill: #0F172A; stroke: #020617; stroke-width: 1.5px; rx: 6px; }

      .part-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
      .box-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1E293B; text-anchor: middle; }

      .lifeline { stroke: #94A3B8; stroke-width: 1.5px; stroke-dasharray: 4 4; }
      .activation-main { fill: #86EFAC; stroke: #166534; stroke-width: 1.5px; }
      .activation-sub { fill: #CBD5E1; stroke: #475569; stroke-width: 1px; }

      .arrow-user { fill: none; stroke: #0F172A; stroke-width: 2.2px; }
      .arrow-async { fill: none; stroke: #2563EB; stroke-width: 1.8px; stroke-dasharray: 6 3; }
      .arrow-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #0F172A; font-weight: bold; }
      .arrow-subtext { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #2563EB; font-weight: 600; }

      .divider { fill: #FEF3C7; stroke: #D97706; stroke-width: 1px; rx: 4px; }
      .divider-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #92400E; text-anchor: middle; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A" />
    </marker>
    <marker id="arrowhead-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="780" class="bg" />

  <!-- Container Boxes -->
  <rect x="130" y="20" width="250" height="40" class="box-client" />
  <text x="255" y="44" class="box-title">Mobile Edge Client (Flutter / Mobile OS)</text>

  <rect x="410" y="20" width="520" height="40" class="box-server" />
  <text x="670" y="44" class="box-title">Backend Platform Services (Cloud Microservices)</text>

  <!-- Participant Lifelines -->
  <!-- 1. User Actor Person Graphic (x=60) -->
  <line x1="60" y1="110" x2="60" y2="740" class="lifeline" />
  
  <!-- Person Graphic -->
  <circle cx="60" cy="65" r="9" class="actor-head" />
  <line x1="60" y1="74" x2="60" y2="92" class="actor-body" />
  <line x1="48" y1="80" x2="72" y2="80" class="actor-body" />
  <line x1="60" y1="92" x2="49" y2="106" class="actor-body" />
  <line x1="60" y1="92" x2="71" y2="106" class="actor-body" />
  <text x="60" y="118" class="part-text" fill="#0F172A" font-size="12px">User</text>

  <!-- 2. Patient App UI (x=190) -->
  <line x1="190" y1="110" x2="190" y2="740" class="lifeline" />
  <rect x="130" y="70" width="120" height="36" class="participant-ui" />
  <text x="190" y="92" class="part-text">App UI (Passkey)</text>

  <!-- 3. Secure Enclave (x=320) -->
  <line x1="320" y1="110" x2="320" y2="740" class="lifeline" />
  <rect x="265" y="70" width="110" height="36" class="participant-enclave" />
  <text x="320" y="92" class="part-text">Secure Enclave</text>

  <!-- 4. API Gateway (x=450) -->
  <line x1="450" y1="110" x2="450" y2="740" class="lifeline" />
  <rect x="400" y="70" width="100" height="36" class="participant-gw" />
  <text x="450" y="92" class="part-text">API Gateway</text>

  <!-- 5. Auth Service (x=590) -->
  <line x1="590" y1="110" x2="590" y2="740" class="lifeline" />
  <rect x="525" y="70" width="130" height="36" class="participant-auth" />
  <text x="590" y="92" class="part-text">Auth Service</text>

  <!-- 6. Audit Service (x=730) -->
  <line x1="730" y1="110" x2="730" y2="740" class="lifeline" />
  <rect x="675" y="70" width="110" height="36" class="participant-audit" />
  <text x="730" y="92" class="part-text">Audit Service</text>

  <!-- 7. Platform Data Store (x=860) -->
  <line x1="860" y1="110" x2="860" y2="740" class="lifeline" />
  <rect x="800" y="70" width="120" height="36" class="participant-db" />
  <text x="860" y="92" class="part-text">Platform Data Store</text>

  <!-- Continuous App UI Activation Bar during behind-the-scenes integrations -->
  <rect x="184" y="170" width="12" height="560" class="activation-main" />

  <!-- Sub activations for backend services -->
  <rect x="445" y="195" width="10" height="120" class="activation-sub" />
  <rect x="585" y="220" width="10" height="75" class="activation-sub" />
  <rect x="315" y="380" width="10" height="75" class="activation-sub" />
  <rect x="445" y="520" width="10" height="145" class="activation-sub" />
  <rect x="585" y="545" width="10" height="100" class="activation-sub" />
  <rect x="725" y="570" width="10" height="50" class="activation-sub" />


  <!-- ================= PHASE 1: BEHIND-THE-SCENES CHALLENGE REQUEST ================= -->
  <rect x="40" y="125" width="880" height="22" class="divider" />
  <text x="480" y="140" class="divider-text">Phase 1: User Request &amp; Behind-the-Scenes FIDO2 Challenge Fetch (Async Dotted Lines)</text>

  <!-- Step 1: User -> UI (User Action - Black Solid Line) -->
  <path d="M 60 170 L 184 170" class="arrow-user" marker-end="url(#arrowhead)" />
  <text x="68" y="165" class="arrow-text">1. User Taps "Passkey Login" (Activates UI)</text>

  <!-- Behind-the-Scenes Integrations (Dotted Lines) -->
  <path d="M 196 195 L 445 195" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="204" y="190" class="arrow-subtext">2. Async Fetch Challenge: POST /v1/auth/passkey/challenge</text>

  <path d="M 455 220 L 585 220" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="462" y="215" class="arrow-subtext">3. Async Forward Challenge</text>

  <path d="M 595 245 L 855 245" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="602" y="240" class="arrow-subtext">4. Async Query FIDO2 Credentials</text>

  <path d="M 855 265 L 595 265" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="605" y="260" class="arrow-subtext">5. Return Credential &amp; Public Key</text>

  <path d="M 585 290 L 455 290" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="465" y="285" class="arrow-subtext">6. Return Challenge Nonce</text>

  <path d="M 445 310 L 196 310" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="205" y="305" class="arrow-subtext">7. Receive Challenge Payload</text>


  <!-- ================= PHASE 2: LOCAL BIOMETRIC ASSERTION ================= -->
  <rect x="40" y="335" width="880" height="22" class="divider" />
  <text x="480" y="350" class="divider-text">Phase 2: Local Biometric Assertion &amp; Secure Enclave Signing</text>

  <path d="M 196 380 L 315 380" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="204" y="375" class="arrow-subtext">8. Async Invoke OS Biometrics (FaceID/TouchID)</text>

  <!-- Step 9: Enclave -> User (Biometric Scan Prompt) -->
  <path d="M 315 405 L 60 405" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="70" y="400" class="arrow-subtext">9. OS Biometric Scan Prompt</text>

  <!-- Step 10: User -> Enclave (User Biometric Verified - Black Solid Line) -->
  <path d="M 60 425 L 315 425" class="arrow-user" stroke="#0F172A" stroke-width="2.2" marker-end="url(#arrowhead)" />
  <text x="70" y="420" class="arrow-text" fill="#0F172A">10. User Biometric Verified (Scan/Touch)</text>

  <path d="M 315 450 L 196 450" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="205" y="445" class="arrow-subtext">11. Signed Assertion { challenge_signature }</text>


  <!-- ================= PHASE 3: SERVER-SIDE VERIFICATION & AUDIT ================= -->
  <rect x="40" y="475" width="880" height="22" class="divider" />
  <text x="480" y="490" class="divider-text">Phase 3: Behind-the-Scenes Server Verification &amp; Audit (Async Dotted Lines)</text>

  <path d="M 196 520 L 445 520" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="204" y="515" class="arrow-subtext">12. Async POST /v1/auth/passkey/verify</text>

  <path d="M 455 545 L 585 545" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="462" y="540" class="arrow-subtext">13. Verify WebAuthn Assertion</text>

  <path d="M 595 570 L 725 570" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="602" y="565" class="arrow-subtext">14. Record HIPAA Auth Audit Event</text>

  <path d="M 735 595 L 855 595" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="742" y="590" class="arrow-subtext">15. Write PhiAuditLog Entry</text>

  <path d="M 855 615 L 595 615" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="605" y="610" class="arrow-subtext">16. Audit Confirmed</text>

  <path d="M 585 640 L 455 640" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="465" y="635" class="arrow-subtext">17. Issue Signed JWT Access &amp; Refresh Tokens</text>

  <path d="M 445 660 L 196 660" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="205" y="655" class="arrow-subtext">18. Return Token Payload</text>


  <!-- ================= PHASE 4: UI RETURN TO USER ================= -->
  <rect x="40" y="685" width="880" height="22" class="divider" />
  <text x="480" y="700" class="divider-text">Phase 4: UI Complete &amp; Final Return to User (Black Solid Return Line)</text>

  <!-- Step 19: UI -> User (Final Return to User - Black Solid Line) -->
  <path d="M 184 730 L 60 730" class="arrow-user" stroke="#0F172A" stroke-width="2.2" marker-end="url(#arrowhead)" />
  <text x="70" y="725" class="arrow-text" fill="#0F172A">19. "Auth Verified ✓" -&gt; Deactivate UI &amp; Auto-Advance to SCR_CALIBRATION_STAGE1</text>

</svg>