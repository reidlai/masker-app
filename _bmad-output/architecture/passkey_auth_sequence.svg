<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="860" height="740" viewBox="0 0 860 740" version="1.1">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .box-client { fill: #F0FDF4; stroke: #166534; stroke-width: 1.5px; rx: 6px; }
      .box-server { fill: #EFF6FF; stroke: #1D4ED8; stroke-width: 1.5px; rx: 6px; }
      
      .actor-head { fill: #F8FAFC; stroke: #0F172A; stroke-width: 2px; }
      .actor-body { stroke: #0F172A; stroke-width: 2px; stroke-linecap: round; }

      .participant-ui { fill: #15803D; stroke: #166534; stroke-width: 1.5px; rx: 6px; }
      .participant-enclave { fill: #166534; stroke: #14532D; stroke-width: 1.5px; rx: 6px; }
      .participant-gw { fill: #1D4ED8; stroke: #1E40AF; stroke-width: 1.5px; rx: 6px; }
      .participant-auth { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1.5px; rx: 6px; }
      .participant-audit { fill: #1E40AF; stroke: #1E3A8A; stroke-width: 1.5px; rx: 6px; }

      .part-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
      .box-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1E293B; text-anchor: middle; }

      .lifeline { stroke: #94A3B8; stroke-width: 1.5px; stroke-dasharray: 4 4; }
      .activation-main { fill: #86EFAC; stroke: #166534; stroke-width: 1.5px; }
      .activation-sub { fill: #CBD5E1; stroke: #475569; stroke-width: 1px; }

      .arrow-user { fill: none; stroke: #0F172A; stroke-width: 2.2px; }
      .arrow-async { fill: none; stroke: #2563EB; stroke-width: 1.8px; stroke-dasharray: 6 3; }
      .arrow-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #0F172A; font-weight: bold; }
      .arrow-subtext { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #2563EB; font-weight: 600; }

      .divider { fill: #FEF3C7; stroke: #D97706; stroke-width: 1px; rx: 4px; }
      .divider-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #92400E; text-anchor: middle; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A" />
    </marker>
    <marker id="arrowhead-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="860" height="740" class="bg" />

  <!-- Container Boxes -->
  <rect x="130" y="20" width="250" height="40" class="box-client" />
  <text x="255" y="44" class="box-title">Mobile Edge Client (Flutter / Mobile OS)</text>

  <rect x="410" y="20" width="410" height="40" class="box-server" />
  <text x="615" y="44" class="box-title">Backend Platform Services (Cloud Microservices)</text>

  <!-- Participant Lifelines -->
  <!-- 1. User Actor Person Graphic (x=60) -->
  <line x1="60" y1="110" x2="60" y2="700" class="lifeline" />
  
  <!-- Person Graphic -->
  <circle cx="60" cy="65" r="9" class="actor-head" />
  <line x1="60" y1="74" x2="60" y2="92" class="actor-body" />
  <line x1="48" y1="80" x2="72" y2="80" class="actor-body" />
  <line x1="60" y1="92" x2="49" y2="106" class="actor-body" />
  <line x1="60" y1="92" x2="71" y2="106" class="actor-body" />
  <text x="60" y="118" class="part-text" fill="#0F172A" font-size="12px">User</text>

  <!-- 2. Patient App UI (x=190) -->
  <line x1="190" y1="110" x2="190" y2="700" class="lifeline" />
  <rect x="130" y="70" width="120" height="36" class="participant-ui" />
  <text x="190" y="92" class="part-text">App UI (Passkey)</text>

  <!-- 3. Secure Enclave (x=320) -->
  <line x1="320" y1="110" x2="320" y2="700" class="lifeline" />
  <rect x="265" y="70" width="110" height="36" class="participant-enclave" />
  <text x="320" y="92" class="part-text">Secure Enclave</text>

  <!-- 4. Auth Service (x=530) -->
  <line x1="530" y1="110" x2="530" y2="700" class="lifeline" />
  <rect x="465" y="70" width="130" height="36" class="participant-auth" />
  <text x="530" y="92" class="part-text">Auth Service</text>

  <!-- 5. Audit Service (x=710) -->
  <line x1="710" y1="110" x2="710" y2="700" class="lifeline" />
  <rect x="655" y="70" width="110" height="36" class="participant-audit" />
  <text x="710" y="92" class="part-text">Audit Service</text>

  <!-- Continuous App UI Activation Bar -->
  <rect x="184" y="170" width="12" height="520" class="activation-main" />

  <!-- Sub activations for backend services -->
  <rect x="525" y="195" width="10" height="60" class="activation-sub" />
  <rect x="315" y="340" width="10" height="75" class="activation-sub" />
  <rect x="525" y="470" width="10" height="110" class="activation-sub" />
  <rect x="705" y="515" width="10" height="40" class="activation-sub" />

  <!-- ================= PHASE 1: BEHIND-THE-SCENES CHALLENGE REQUEST ================= -->
  <rect x="40" y="125" width="780" height="22" class="divider" />
  <text x="430" y="140" class="divider-text">Phase 1: Behind-the-Scenes FIDO2 Challenge Request</text>

  <!-- Step 1: User -> UI -->
  <path d="M 60 170 L 184 170" class="arrow-user" marker-end="url(#arrowhead)" />
  <text x="68" y="165" class="arrow-text">1. User Taps "Login with Passkey" (Activates UI)</text>

  <!-- Step 2: UI -> AuthSvc -->
  <path d="M 196 195 L 525 195" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="204" y="190" class="arrow-subtext">2. Async Fetch Challenge: POST /v1/auth/passkey/challenge</text>

  <!-- Step 3 & 4: AuthSvc Internal & Return -->
  <path d="M 525 240 L 196 240" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="205" y="235" class="arrow-subtext">3. 200 OK Challenge Response { challenge_nonce, credential_id }</text>


  <!-- ================= PHASE 2: LOCAL BIOMETRIC ASSERTION ================= -->
  <rect x="40" y="280" width="780" height="22" class="divider" />
  <text x="430" y="295" class="divider-text">Phase 2: Local Biometric Assertion &amp; Secure Enclave Signing</text>

  <path d="M 196 325 L 315 325" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="204" y="320" class="arrow-subtext">4. Prompt Biometrics (FaceID / TouchID / Windows Hello)</text>

  <path d="M 315 350 L 60 350" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="70" y="345" class="arrow-subtext">5. Request Biometric Touch / Scan</text>

  <path d="M 60 375 L 315 375" class="arrow-user" stroke="#0F172A" stroke-width="2.2" marker-end="url(#arrowhead)" />
  <text x="70" y="370" class="arrow-text" fill="#0F172A">6. User Verified (Fingerprint / Face)</text>

  <path d="M 315 400 L 196 400" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="205" y="395" class="arrow-subtext">7. Return FIDO2 Assertion Signature { challenge_signature }</text>


  <!-- ================= PHASE 3: SERVER-SIDE VERIFICATION & AUDIT ================= -->
  <rect x="40" y="435" width="780" height="22" class="divider" />
  <text x="430" y="450" class="divider-text">Phase 3: Behind-the-Scenes Server Verification &amp; Audit Stream</text>

  <path d="M 196 470 L 525 470" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="204" y="465" class="arrow-subtext">8. Async Verification: POST /v1/auth/passkey/verify</text>

  <path d="M 535 515 L 705 515" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="542" y="510" class="arrow-subtext">9. Emit Auth Event (Asynchronous One-Way Audit Stream)</text>

  <path d="M 525 565 L 196 565" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="205" y="560" class="arrow-subtext">10. 200 OK + Set Secure HTTP-Only Token Cookie { access_token, refresh_token }</text>


  <!-- ================= PHASE 4: UI RETURN TO USER ================= -->
  <rect x="40" y="605" width="780" height="22" class="divider" />
  <text x="430" y="620" class="divider-text">Phase 4: UI Complete &amp; Final Return to User</text>

  <path d="M 184 660 L 60 660" class="arrow-user" stroke="#0F172A" stroke-width="2.2" marker-end="url(#arrowhead)" />
  <text x="70" y="655" class="arrow-text" fill="#0F172A">11. Render "Authentication Verified ✓" &amp; Auto-advance to SCR_CALIBRATION_STAGE1</text>

</svg>