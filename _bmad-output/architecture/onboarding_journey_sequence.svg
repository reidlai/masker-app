<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="840" viewBox="0 0 980 840" version="1.1">
  <defs>
    <style>
      .bg { fill: #F8FAFC; }
      .box-client { fill: #F0FDF4; stroke: #166534; stroke-width: 1.5px; rx: 6px; }
      .box-server { fill: #EFF6FF; stroke: #1D4ED8; stroke-width: 1.5px; rx: 6px; }
      
      .actor-head { fill: #F8FAFC; stroke: #0F172A; stroke-width: 2px; }
      .actor-body { stroke: #0F172A; stroke-width: 2px; stroke-linecap: round; }

      .participant-ui { fill: #15803D; stroke: #166534; stroke-width: 1.5px; rx: 6px; }
      .participant-enclave { fill: #166534; stroke: #14532D; stroke-width: 1.5px; rx: 6px; }
      .participant-auth { fill: #2563EB; stroke: #1D4ED8; stroke-width: 1.5px; rx: 6px; }
      .participant-profile { fill: #0284C7; stroke: #0369A1; stroke-width: 1.5px; rx: 6px; }
      .participant-audit { fill: #1E40AF; stroke: #1E3A8A; stroke-width: 1.5px; rx: 6px; }

      .part-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #FFFFFF; text-anchor: middle; }
      .box-title { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #1E293B; text-anchor: middle; }

      .lifeline { stroke: #94A3B8; stroke-width: 1.5px; stroke-dasharray: 4 4; }
      .activation-main { fill: #86EFAC; stroke: #166534; stroke-width: 1.5px; }
      .activation-sub { fill: #CBD5E1; stroke: #475569; stroke-width: 1px; }

      .arrow-user { fill: none; stroke: #0F172A; stroke-width: 2.2px; }
      .arrow-async { fill: none; stroke: #2563EB; stroke-width: 1.8px; stroke-dasharray: 6 3; }
      .arrow-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; fill: #0F172A; font-weight: bold; }
      .arrow-subtext { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 10px; fill: #2563EB; font-weight: 600; }

      .divider { fill: #FEF3C7; stroke: #D97706; stroke-width: 1px; rx: 4px; }
      .divider-text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 11px; font-weight: bold; fill: #92400E; text-anchor: middle; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#0F172A" />
    </marker>
    <marker id="arrowhead-async" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563EB" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="980" height="840" class="bg" />

  <!-- Title Banner -->
  <text x="490" y="30" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16px" font-weight="bold" fill="#0F172A" text-anchor="middle">Patient Onboarding Journey End-to-End Sequence Architecture</text>

  <!-- Container Boxes -->
  <rect x="130" y="55" width="250" height="40" class="box-client" />
  <text x="255" y="79" class="box-title">Mobile Edge Client (Flutter / Mobile OS)</text>

  <rect x="410" y="55" width="530" height="40" class="box-server" />
  <text x="675" y="79" class="box-title">Backend Platform Services (Cloud Microservices)</text>

  <!-- Participant Lifelines -->
  <!-- 1. User Actor Person Graphic (x=60) -->
  <line x1="60" y1="145" x2="60" y2="800" class="lifeline" />
  
  <!-- Person Graphic -->
  <circle cx="60" cy="100" r="9" class="actor-head" />
  <line x1="60" y1="109" x2="60" y2="127" class="actor-body" />
  <line x1="48" y1="115" x2="72" y2="115" class="actor-body" />
  <line x1="60" y1="127" x2="49" y2="141" class="actor-body" />
  <line x1="60" y1="127" x2="71" y2="141" class="actor-body" />
  <text x="60" y="153" class="part-text" fill="#0F172A" font-size="12px">User</text>

  <!-- 2. Patient App UI (x=190) -->
  <line x1="190" y1="145" x2="190" y2="800" class="lifeline" />
  <rect x="130" y="105" width="120" height="36" class="participant-ui" />
  <text x="190" y="127" class="part-text">Patient App UI</text>

  <!-- 3. Secure Enclave (x=320) -->
  <line x1="320" y1="145" x2="320" y2="800" class="lifeline" />
  <rect x="265" y="105" width="110" height="36" class="participant-enclave" />
  <text x="320" y="127" class="part-text">Secure Enclave</text>

  <!-- 4. Auth Service (x=490) -->
  <line x1="490" y1="145" x2="490" y2="800" class="lifeline" />
  <rect x="425" y="105" width="130" height="36" class="participant-auth" />
  <text x="490" y="127" class="part-text">Auth Service</text>

  <!-- 5. Profile Service (x=670) -->
  <line x1="670" y1="145" x2="670" y2="800" class="lifeline" />
  <rect x="605" y="105" width="130" height="36" class="participant-profile" />
  <text x="670" y="127" class="part-text">Profile Service</text>

  <!-- 6. Audit Service (x=850) -->
  <line x1="850" y1="145" x2="850" y2="800" class="lifeline" />
  <rect x="795" y="105" width="110" height="36" class="participant-audit" />
  <text x="850" y="127" class="part-text">Audit Service</text>

  <!-- Continuous App UI Activation Bar -->
  <rect x="184" y="200" width="12" height="580" class="activation-main" />

  <!-- ================= PHASE 1: ACCOUNT REGISTRATION ================= -->
  <rect x="40" y="160" width="900" height="22" class="divider" />
  <text x="490" y="175" class="divider-text">Phase 1: Patient Account Registration (Task_PatientRegister)</text>

  <path d="M 60 200 L 184 200" class="arrow-user" marker-end="url(#arrowhead)" />
  <text x="68" y="195" class="arrow-text">1. User Enters Email, Password &amp; Accepts Terms (SCR_REGISTER_ACCOUNT)</text>

  <path d="M 196 225 L 485 225" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="204" y="220" class="arrow-subtext">2. Async Registration: POST /v1/auth/register { email, password_hash, user_type: "PATIENT" }</text>

  <path d="M 495 245 L 845 245" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="502" y="240" class="arrow-subtext">3. Emit Account Creation Audit Event</text>

  <path d="M 485 270 L 196 270" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="205" y="265" class="arrow-subtext">4. 201 Created Response { user_id, session_token } &amp; Auto-Advance to SCR_USER_PROFILE</text>

  <!-- ================= PHASE 2: MEDICAL PROFILE CREATION ================= -->
  <rect x="40" y="295" width="900" height="22" class="divider" />
  <text x="490" y="310" class="divider-text">Phase 2: Medical Profile &amp; Emergency Caregiver Setup (Task_CreateUserProfile)</text>

  <path d="M 60 335 L 184 335" class="arrow-user" marker-end="url(#arrowhead)" />
  <text x="68" y="330" class="arrow-text">5. User Fills Demographics &amp; Caregiver Phone (SCR_USER_PROFILE)</text>

  <path d="M 196 360 L 665 360" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="204" y="355" class="arrow-subtext">6. Async Profile Save: POST /v1/patient/profile { user_id, age, weight_kg, height_cm, bmi, caregiver_phone }</text>

  <path d="M 675 380 L 845 380" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="682" y="375" class="arrow-subtext">7. Audit Log Profile Update</text>

  <path d="M 665 405 L 196 405" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="205" y="400" class="arrow-subtext">8. 200 OK Profile Saved &amp; Auto-Advance to SCR_REGISTER_PASSKEY</text>

  <!-- ================= PHASE 3: FIDO2 PASSKEY ENROLLMENT ================= -->
  <rect x="40" y="430" width="900" height="22" class="divider" />
  <text x="490" y="445" class="divider-text">Phase 3: FIDO2 Biometric Passkey Enrollment (Task_RegisterPasskey)</text>

  <path d="M 60 470 L 184 470" class="arrow-user" marker-end="url(#arrowhead)" />
  <text x="68" y="465" class="arrow-text">9. User Taps "Enroll Passkey" (SCR_REGISTER_PASSKEY)</text>

  <path d="M 196 495 L 485 495" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="204" y="490" class="arrow-subtext">10. Fetch Creation Challenge: POST /v1/auth/passkey/enroll-challenge</text>

  <path d="M 485 520 L 196 520" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="205" y="515" class="arrow-subtext">11. Return Challenge { creation_challenge_nonce }</text>

  <path d="M 196 545 L 315 545" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="204" y="540" class="arrow-subtext">12. Invoke Secure Enclave Keypair Generation</text>

  <path d="M 315 570 L 60 570" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="70" y="565" class="arrow-subtext">13. OS Biometric Scan Prompt (FaceID / TouchID)</text>

  <path d="M 60 595 L 315 595" class="arrow-user" marker-end="url(#arrowhead)" />
  <text x="70" y="590" class="arrow-text">14. User Verified (Fingerprint / Face)</text>

  <path d="M 315 620 L 196 620" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="205" y="615" class="arrow-subtext">15. Return Keypair { passkey_credential_id, public_key_pem }</text>

  <path d="M 196 645 L 485 645" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="204" y="640" class="arrow-subtext">16. Complete Enrollment: POST /v1/auth/passkey/enroll-verify</text>

  <path d="M 495 670 L 845 670" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="502" y="665" class="arrow-subtext">17. Record Passkey Registration Audit Event</text>

  <path d="M 485 695 L 196 695" class="arrow-async" marker-end="url(#arrowhead-async)" />
  <text x="205" y="690" class="arrow-subtext">18. 200 OK Passkey Registered ✓</text>

  <!-- ================= PHASE 4: ONBOARDING COMPLETE ================= -->
  <rect x="40" y="720" width="900" height="22" class="divider" />
  <text x="490" y="735" class="divider-text">Phase 4: Onboarding Complete &amp; Final Return to User</text>

  <path d="M 184 765 L 60 765" class="arrow-user" marker-end="url(#arrowhead)" />
  <text x="70" y="760" class="arrow-text">19. Render "Onboarding Complete ✓" &amp; Auto-Advance to Bedtime Session Ready State</text>

</svg>